spring:
  application:
    name: risk-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrier}
    username: ${DB_USER:barrier}
    password: ${DB_PASSWORD:barrier}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # O relay publica com .join() (síncrono, para só marcar SENT após confirmação do broker).
        # Sem estes limites, um broker em rebalance deixa o join() pendurado pelos 2 min padrão de
        # delivery.timeout.ms — segurando a thread do scheduler e a transação da outbox.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
  task:
    scheduling:
      # Era 1 thread (default do Spring), compartilhada por AssessmentProcessor, OutboxRelay e
      # WatchlistImporter. A importação das 03:00 (dezenas de milhar de linhas) congelava o
      # processamento de avaliações, e um Kafka lento congelava os dois.
      pool:
        size: 4
      thread-name-prefix: barrier-sched-

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8080}

logging:
  # Correlação e avaliação no console de dev; em prod o log é JSON e o MDC vai inteiro (ver
  # application-prod.yml). Sem isto, o MDC existe mas não aparece em lugar nenhum.
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-},%X{assessmentId:-}]"
  level:
    # DEBUG de bureau/screening expõe dado pessoal (nome do cliente, razão social) — vale só em
    # dev. O profile prod sobrescreve para INFO; ver application-prod.yml.
    com.barrier.riskengine.identity: DEBUG
    com.barrier.riskengine.screening: DEBUG
    # Silencia os dumps verbosos de startup (info do banco e configs completas do Kafka).
    org.hibernate.orm.connections.pooling: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

barrier:
  admin:
    # Protege /v1/risk-rules e /v1/tenants/*/risk-config (header X-Admin-Key). Vazia por padrão:
    # em dev o filtro fica inerte; em prod a aplicação não sobe sem ela (AdminApiKeyReadinessGuard).
    api-key: ${ADMIN_API_KEY:}
  assessment:
    processor-delay-ms: 2000
    # Posse de uma avaliação reivindicada. Precisa ser maior que o pior caso de processamento
    # (cadeia de bureaus + screening); curta demais faz outra réplica reprocessar em paralelo.
    lease: PT5M
    # Tentativas antes de marcar FALHA_PROCESSAMENTO, com backoff exponencial entre elas.
    max-attempts: 5
    base-backoff: PT30S
  outbox:
    relay-delay-ms: 2000
  identity:
    brasilapi:
      base-url: https://brasilapi.com.br
    bigboost:
      # Bureau real de CPF (BigDataCorp, dataset basic_data). Desligado por padrão — dev/testes
      # usam o StubBureauProvider. Habilitar exige credenciais reais (self-service, sem CNPJ
      # para contratar — ver docs/adr/0014-bureau-cpf-bigboost.md).
      enabled: false
      base-url: https://plataforma.bigdatacorp.com.br
      access-token: ${BIGBOOST_ACCESS_TOKEN:}
      token-id: ${BIGBOOST_TOKEN_ID:}
  watchlist:
    # Fontes reais que baixam arquivos publicados. Desligadas por padrão (dev/testes não baixam
    # nada); ligue em produção. A importação isola falhas por fonte.
    # Atualização automática: roda no startup e no cron abaixo (replaceSource é atômico).
    refresh-cron: "0 0 3 * * *" # todo dia às 03:00
    cgu:
      enabled: false
      base-url: https://portaldatransparencia.gov.br
      reference-date: "" # vazio = data de hoje (yyyyMMdd)
    ofac:
      enabled: false
      base-url: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports
      sdn-path: /SDN.CSV # nomes primários (SDN)
      alt-path: /ALT.CSV # apelidos/aka
  screening:
    fuzzy:
      # Limiar POR TOKEN (Jaro-Winkler), não sobre o nome inteiro — não é comparável ao 0.95
      # anterior, que era medido sobre a string toda e por isso perdia nome em ordem invertida
      # ("SILVA, JOSE ANTONIO" na lista vs. "Jose Antonio da Silva" no cadastro). Aqui 0.90 absorve
      # erro de digitação dentro de um token e ainda separa sobrenomes diferentes.
      # Calibrar isto olhando só falso positivo foi o que quebrou o controle: em screening de
      # sanção, medir recall primeiro (conjunto rotulado), precisão depois.
      threshold: 0.90
      min-name-length: 6
  risk:
    new-company:
      months: 6
      score: 150
    sensitive-cnae-score: 200
