spring:
  application:
    name: risk-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrier}
    username: ${DB_USER:barrier}
    password: ${DB_PASSWORD:barrier}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    # Visibilidade de bureau (resposta/perfil) e screening (listas/apontamentos, incl. OFAC/CGU).
    # Baixar para INFO em produção se o volume incomodar (o essencial já sai em INFO).
    com.barrier.riskengine.identity: DEBUG
    com.barrier.riskengine.screening: DEBUG
    # Silencia os dumps verbosos de startup (info do banco e configs completas do Kafka).
    org.hibernate.orm.connections.pooling: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

barrier:
  assessment:
    processor-delay-ms: 2000
  outbox:
    relay-delay-ms: 2000
  identity:
    brasilapi:
      base-url: https://brasilapi.com.br
    bigboost:
      # Bureau real de CPF (BigDataCorp, dataset basic_data). Desligado por padrão — dev/testes
      # usam o StubBureauProvider. Habilitar exige credenciais reais (self-service, sem CNPJ
      # para contratar — ver docs/adr/0014-bureau-cpf-bigboost.md).
      enabled: false
      base-url: https://plataforma.bigdatacorp.com.br
      access-token: ${BIGBOOST_ACCESS_TOKEN:}
      token-id: ${BIGBOOST_TOKEN_ID:}
  watchlist:
    # Fontes reais que baixam arquivos publicados. Desligadas por padrão (dev/testes não baixam
    # nada); ligue em produção. A importação isola falhas por fonte.
    # Atualização automática: roda no startup e no cron abaixo (replaceSource é atômico).
    refresh-cron: "0 0 3 * * *" # todo dia às 03:00
    cgu:
      enabled: false
      base-url: https://portaldatransparencia.gov.br
      reference-date: "" # vazio = data de hoje (yyyyMMdd)
    ofac:
      enabled: false
      base-url: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports
      sdn-path: /SDN.CSV # nomes primários (SDN)
      alt-path: /ALT.CSV # apelidos/aka
  screening:
    fuzzy:
      threshold: 0.95 # mais restritivo: evita falso positivo em nomes genéricos (ex.: "NATIONAL BANK OF …")
      min-name-length: 6
  risk:
    new-company:
      months: 6
      score: 150
    sensitive-cnae-score: 200
