spring:
  application:
    name: risk-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrier}
    username: ${DB_USER:barrier}
    password: ${DB_PASSWORD:barrier}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        # O relay publica com .join() (síncrono, para só marcar SENT após confirmação do broker).
        # Sem estes limites, um broker em rebalance deixa o join() pendurado pelos 2 min padrão de
        # delivery.timeout.ms — segurando a thread do scheduler e a transação da outbox.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
  task:
    scheduling:
      # Era 1 thread (default do Spring), compartilhada por AssessmentProcessor, OutboxRelay e
      # WatchlistImporter. A importação das 03:00 (dezenas de milhar de linhas) congelava o
      # processamento de avaliações, e um Kafka lento congelava os dois.
      pool:
        size: 4
      thread-name-prefix: barrier-sched-

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: ${SERVER_PORT:8080}

logging:
  # Correlação e avaliação no console de dev; em prod o log é JSON e o MDC vai inteiro (ver
  # application-prod.yml). Sem isto, o MDC existe mas não aparece em lugar nenhum.
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-},%X{assessmentId:-}]"
  level:
    # DEBUG de bureau/screening expõe dado pessoal (nome do cliente, razão social) — vale só em
    # dev. O profile prod sobrescreve para INFO; ver application-prod.yml.
    com.barrier.riskengine.identity: DEBUG
    com.barrier.riskengine.screening: DEBUG
    # Silencia os dumps verbosos de startup (info do banco e configs completas do Kafka).
    org.hibernate.orm.connections.pooling: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

barrier:
  # Preenchido pelo Maven (resource filtering do spring-boot-starter-parent) a partir da
  # versão do POM — o banner lê daqui, então basta bumpar o POM para o banner acompanhar.
  version: @project.version@
  admin:
    # Protege /v1/risk-rules e /v1/tenants/*/risk-config (header X-Admin-Key). Vazia por padrão:
    # em dev o filtro fica inerte; em prod a aplicação não sobe sem ela (AdminApiKeyReadinessGuard).
    api-key: ${ADMIN_API_KEY:}
  assessment:
    processor-delay-ms: 2000
    # Posse de uma avaliação reivindicada. Precisa ser maior que o pior caso de processamento
    # (cadeia de bureaus + screening); curta demais faz outra réplica reprocessar em paralelo.
    lease: PT5M
    # Tentativas antes de marcar FALHA_PROCESSAMENTO, com backoff exponencial entre elas.
    max-attempts: 5
    base-backoff: PT30S
    # Por quanto tempo uma Idempotency-Key do intake continua valendo como repetição. 24h cobre
    # retry de rede, redeploy do cliente e reprocessamento de fila; passado isso, a mesma chave
    # começa uma avaliação nova — o que é o correto, porque a decisão de KYC envelhece.
    idempotency-window: PT24H
    idempotency-purge-cron: "0 30 3 * * *" # todo dia às 03:30
  outbox:
    relay-delay-ms: 2000
  resilience:
    # Disjuntor por bureau: N falhas seguidas param as chamadas por open-duration. Sem isto, cada
    # avaliação paga o timeout inteiro de um provider que já se sabe fora do ar.
    failure-threshold: 5
    open-duration: PT30S
  identity:
    # Guarda a resposta do bureau (com redação) junto com o id da consulta, como evidência de
    # auditoria — sem ela, "consultamos o bureau" é afirmação nossa sobre nós mesmos. É dado
    # pessoal: retenção de 10 anos e criptografia em repouso são pendências da Fase 6 e valem para
    # esta coluna. Desligue aqui para guardar só o identificador.
    store-raw-response: true
    reuse:
      # Desligado por padrão: ligar muda de onde vem a evidência de uma decisão, e isso é decisão
      # de produto, não default de framework. Só CPF entra (ver IdentityService.findReusable).
      enabled: false
      ttl: PT24H
    brasilapi:
      # Bureau de CNPJ da fase de teste: API pública, gratuita, sem SLA e sem contrato. Ligada por
      # padrão em dev; em produção a decisão de mantê-la fica explícita (CnpjBureauReadinessGuard
      # avisa quando ela é a única fonte de PJ).
      enabled: true
      base-url: https://brasilapi.com.br
    bigboost:
      # Bureau real de CPF (BigDataCorp, dataset basic_data). Desligado por padrão — dev/testes
      # usam o StubBureauProvider. Habilitar exige credenciais reais (self-service, sem CNPJ
      # para contratar — ver docs/adr/0014-bureau-cpf-bigboost.md).
      enabled: false
      base-url: https://plataforma.bigdatacorp.com.br
      access-token: ${BIGBOOST_ACCESS_TOKEN:}
      token-id: ${BIGBOOST_TOKEN_ID:}
  serpro:
    # Conectividade compartilhada com o gateway Serpro (token OAuth2 + RestClient do
    # datavalid/v5) — usada tanto pela biometria facial por PIN (assurance) quanto pela
    # validação cadastral (subject.profile): mesma credencial, mesmo token, mesmo gateway.
    # Desligado por padrão — dev/testes usam os stubs de cada módulo. Habilitar exige
    # credenciais reais de produção (SERPRO_CONSUMER_KEY/SERPRO_CONSUMER_SECRET).
    enabled: false
    base-url: https://gateway.apiserpro.serpro.gov.br/datavalid/v5
    auth-base-url: https://gateway.apiserpro.serpro.gov.br
    consumer-key: ${SERPRO_CONSUMER_KEY:}
    consumer-secret: ${SERPRO_CONSUMER_SECRET:}
  registry-validation:
    # Validação cadastral (Datavalid pessoa-fisica/validacao) contra RFB/SENATRAN, em
    # subject.profile — reusa a conectividade de barrier.serpro acima (mesma credencial).
    # Desligado por padrão; StubRegistryValidationProvider atende em dev/testes. Campos de
    # privacidade são config de contrato, não segredo técnico: id-template (RFB) e
    # token/cnpj-anuente (SENATRAN) vêm do cadastro do parceiro junto ao Serpro.
    enabled: false
    rfb-id-template: ${SERPRO_RFB_ID_TEMPLATE:}
    senatran-token: ${SERPRO_SENATRAN_TOKEN:}
    senatran-cnpj-anuente: ${SERPRO_SENATRAN_CNPJ_ANUENTE:}
  assurance:
    serpro:
      # privacidade-token/cnpj-anuente vêm do cadastro do parceiro junto ao Serpro para a
      # biometria — não são segredo técnico mas também não têm default de dev sensato, ficam
      # vazios até serem configurados. Conectividade (enabled/base-url/credenciais) mudou para
      # barrier.serpro acima.
      privacidade-token: ${SERPRO_PRIVACIDADE_TOKEN:}
      cnpj-anuente: ${SERPRO_CNPJ_ANUENTE:}
    poller:
      # Frequência do AssuranceResultPoller e por quanto tempo um item reivindicado fica com a
      # posse antes de outra réplica poder tentar de novo — mesmo mecanismo do outbox.
      delay-ms: 5000
      lease: PT1M
  watchlist:
    # Fontes reais que baixam arquivos publicados. Desligadas por padrão (dev/testes não baixam
    # nada); ligue em produção. A importação isola falhas por fonte.
    # Atualização automática: roda no startup e no cron abaixo (replaceSource é atômico).
    refresh-cron: "0 0 3 * * *" # todo dia às 03:00
    cgu:
      enabled: false
      base-url: https://portaldatransparencia.gov.br
      reference-date: "" # vazio = data de hoje (yyyyMMdd)
    ofac:
      enabled: false
      base-url: https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports
      sdn-path: /SDN.CSV # nomes primários (SDN)
      alt-path: /ALT.CSV # apelidos/aka
    un:
      # CSNU/ONU — Lei 13.810/2019 manda indisponibilizar ativos destes sancionados de imediato.
      # É a lista de cumprimento mais direto que existe; desligada aqui só porque dev não baixa nada.
      enabled: false
      base-url: https://scsanctions.un.org
      path: /resources/xml/en/consolidated.xml
  screening:
    fuzzy:
      # Limiar POR TOKEN (Jaro-Winkler), não sobre o nome inteiro — não é comparável ao 0.95
      # anterior, que era medido sobre a string toda e por isso perdia nome em ordem invertida
      # ("SILVA, JOSE ANTONIO" na lista vs. "Jose Antonio da Silva" no cadastro). Aqui 0.90 absorve
      # erro de digitação dentro de um token e ainda separa sobrenomes diferentes.
      # Calibrar isto olhando só falso positivo foi o que quebrou o controle: em screening de
      # sanção, medir recall primeiro (conjunto rotulado), precisão depois.
      threshold: 0.90
      min-name-length: 6
  risk:
    new-company:
      months: 6
      score: 150
    sensitive-cnae-score: 200
  monitoring:
    # Alertas do pipeline. Desligados por padrão: sem histórico real o baseline não tem o que
    # comparar (ver Baseline.MIN_SAMPLES). Ligados em application-prod.yml.
    alerts:
      enabled: false
    # Dias de histórico do baseline — a mesma janela de 60 minutos em cada um dos dias anteriores.
    history-days: 7
    # Quanto tempo um mesmo código de alerta espera antes de repetir.
    repeat-interval: PT1H
  behavior:
    # Ingestão de fato comportamental (fila-origem F8). Ligada: gravar fato não decide nada e não
    # custa consulta paga — o que custa é a regra que vai ler o acervo, e ela ainda não existe.
    enabled: true
    # Tolerância de relógio adiantado do parceiro. Fato "do futuro" fica eternamente dentro de
    # qualquer janela deslizante construída sobre estes eventos.
    max-future-skew: PT5M
