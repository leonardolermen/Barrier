spring:
  application:
    name: risk-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrier}
    username: ${DB_USER:barrier}
    password: ${DB_PASSWORD:barrier}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}

barrier:
  assessment:
    processor-delay-ms: 2000
  outbox:
    relay-delay-ms: 2000
