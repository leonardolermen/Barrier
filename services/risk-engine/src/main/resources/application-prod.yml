# Profile de produção: habilita as fontes reais de watchlist (ver ADR-0013 e
# WatchlistReadinessGuard, que falha a subida se estas flags ficarem desligadas aqui).

# DEBUG em identity/screening imprime nome do cliente e razão social a cada avaliação — dado
# pessoal indo para o agregador de logs sem base legal nem controle de acesso. Em produção o
# essencial (desfecho, provider, documento mascarado) já sai em INFO.
logging:
  # Log estruturado em produção: o MDC (correlationId, assessmentId) vira campo indexável em vez de
  # texto dentro da linha. É a diferença entre "grep no agregador" e "filtrar por correlationId".
  structured:
    format:
      console: ecs
  level:
    com.barrier: INFO
    com.barrier.riskengine.identity: INFO
    com.barrier.riskengine.screening: INFO

barrier:
  identity:
    # Bureau contratado (ADR-0014) para CPF e CNPJ. Sem ele, o CnpjBureauReadinessGuard e o
    # CpfBureauReadinessGuard impedem a subida: decidir KYC com provider simulado é o fail-open que
    # a auditoria nomeou.
    bigboost:
      enabled: true
  watchlist:
    cgu:
      enabled: true
    ofac:
      enabled: true
    # CSNU: obrigação legal direta (Lei 13.810/2019). Não é opcional em produção.
    un:
      enabled: true
  monitoring:
    # Alertas com baseline móvel (fila-origem F5). Ligados em produção e desligados em dev pelo
    # motivo de sempre: em dev a série histórica é ruído, e alerta que grita sem motivo é alerta
    # que o time aprende a ignorar antes de precisar dele.
    alerts:
      enabled: true

springdoc:
  # UI desligada em prod, spec ligado. O artefato de produto e o ARQUIVO do spec, publicado no site
  # de documentacao; uma UI viva no host da API e superficie extra servindo o mesmo conteudo, no
  # mesmo raciocinio que tirou o /actuator da porta de negocio.
  swagger-ui:
    enabled: false
