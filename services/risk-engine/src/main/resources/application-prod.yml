# Profile de produção: habilita as fontes reais de watchlist (ver ADR-0013 e
# WatchlistReadinessGuard, que falha a subida se estas flags ficarem desligadas aqui).

# DEBUG em identity/screening imprime nome do cliente e razão social a cada avaliação — dado
# pessoal indo para o agregador de logs sem base legal nem controle de acesso. Em produção o
# essencial (desfecho, provider, documento mascarado) já sai em INFO.
logging:
  # Log estruturado em produção: o MDC (correlationId, assessmentId) vira campo indexável em vez de
  # texto dentro da linha. É a diferença entre "grep no agregador" e "filtrar por correlationId".
  structured:
    format:
      console: ecs
  level:
    com.barrier: INFO
    com.barrier.riskengine.identity: INFO
    com.barrier.riskengine.screening: INFO

barrier:
  watchlist:
    cgu:
      enabled: true
    ofac:
      enabled: true
