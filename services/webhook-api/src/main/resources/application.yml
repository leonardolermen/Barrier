spring:
  application:
    name: webhook-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrier}
    username: ${DB_USER:barrier}
    password: ${DB_PASSWORD:barrier}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: webhook
  flyway:
    enabled: true
    schemas: webhook
    default-schema: webhook
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: webhook-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Producer existe só para a DLT: o que não pôde ser entregue precisa ir para algum lugar
    # inspecionável em vez de sumir ou travar a partição.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    # Silencia os dumps verbosos de startup (info do banco e configs completas do Kafka).
    org.hibernate.orm.connections.pooling: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

barrier:
  # Preenchido pelo Maven (resource filtering do spring-boot-starter-parent) a partir da
  # versão do POM — o banner lê daqui, então basta bumpar o POM para o banner acompanhar.
  version: @project.version@
  admin:
    # Protege /v1/webhook-endpoints (header X-Admin-Key). Vazia por padrão: em dev o filtro fica
    # inerte; em prod a aplicação não sobe sem ela (AdminApiKeyReadinessGuard).
    api-key: ${ADMIN_API_KEY:}
  webhook:
    # Destino ÚNICO para todos os tenants — conveniência de desenvolvimento. O destino real é o
    # registro por tenant (webhook_endpoints); em prod esta propriedade é proibida, porque com dois
    # tenants ela entrega as decisões de um no endpoint do outro (GlobalTargetUrlReadinessGuard).
    target-url: ${WEBHOOK_TARGET_URL:}
    # Segredo GLOBAL — fallback de desenvolvimento, no mesmo desenho do target-url. O segredo real é
    # por tenant (webhook_endpoints.secret): um segredo comum permite a um parceiro forjar o
    # callback de KYC de outro.
    secret: ${WEBHOOK_SECRET:dev-secret}
    # Por quanto tempo o segredo anterior continua aceito depois de uma rotação. Durante a janela a
    # entrega leva as duas assinaturas, e o parceiro troca a chave quando puder.
    secret-rotation-overlap: PT24H
    max-attempts: 5
    base-backoff: 30s
    retry-delay-ms: 5000
    consumer:
      # Retry do CONSUMO (não da entrega): falha transitória é retentada sem commitar o offset,
      # até no máximo retry-max-elapsed; depois o evento vai para a DLT e a reconciliação assume.
      retry-initial: PT2S
      retry-max-elapsed: PT2M
    reconciliation:
      # Relê o tópico e cria entrega para toda decisão que não tem uma. A janela precisa caber na
      # retenção do Kafka — é ela que limita o quanto de indisponibilidade dá para recuperar.
      window: PT6H
      cron: "0 */15 * * * *" # a cada 15 minutos
