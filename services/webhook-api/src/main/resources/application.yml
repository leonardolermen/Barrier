spring:
  application:
    name: webhook-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barrier}
    username: ${DB_USER:barrier}
    password: ${DB_PASSWORD:barrier}
    hikari:
      # Ver a conta em services/risk-engine/.../application.yml: o pool é por POD, e o total
      # somado das duas aplicações precisa caber no max_connections do Postgres.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: webhook
  flyway:
    enabled: true
    schemas: webhook
    default-schema: webhook
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      # Threads de consumo por pod. Com 6 particoes e 5 pods, 1 thread por pod ja distribui bem;
      # o valor existe para o caso de particoes >> pods (drenar backlog sem subir replica).
      # Teto util: particoes / pods. Acima disso, thread ociosa.
      concurrency: ${KAFKA_CONCURRENCY:1}
    consumer:
      group-id: webhook-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # Producer existe só para a DLT: o que não pôde ser entregue precisa ir para algum lugar
    # inspecionável em vez de sumir ou travar a partição.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
  task:
    scheduling:
      # Era 1 thread (default do Spring), e a risk-engine ja tinha corrigido o mesmo problema no
      # proprio application.yml — este servico ficou de fora.
      #
      # Passou a doer quando a entrega virou paralela: retryDue() espera o lote inteiro (allOf) na
      # thread do scheduler. Um lote de 100 com 3 workers sao ~34 rodadas; se os destinos penduram
      # ate o read-timeout de 10s, sao ~7 MINUTOS com a unica thread ocupada. Quem divide essa
      # thread e o DeliveryReconciliationJob (cron 0 */15), que o ADR-0017 nomeia dono da
      # recuperacao do que foi para a DLT: o controle de recuperacao simplesmente perde execucoes,
      # sem erro nenhum.
      pool:
        size: 3
      thread-name-prefix: webhook-sched-

server:
  port: ${SERVER_PORT:8082}
  # Drena requisicao em voo no scale-down; ver a nota equivalente na risk-engine.
  shutdown: graceful

management:
  server:
    # Actuator em porta própria; ver a nota longa no application.yml da risk-engine.
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Probes separadas para o Kubernetes (liveness reinicia, readiness tira do balanceador).
      probes:
        enabled: true

logging:
  level:
    # Silencia os dumps verbosos de startup (info do banco e configs completas do Kafka).
    org.hibernate.orm.connections.pooling: WARN
    org.apache.kafka.common.config.AbstractConfig: WARN

webhook-delivery:
  workers: ${WEBHOOK_WORKERS:3}
  headers:
    prefix: X-Barrier
  correlation-mdc-key: correlationId
  flyway:
    # O schema webhook_delivery já existe (V009 moveu as tabelas para lá); a lib baseia o próprio
    # histórico Flyway em 1 em vez de tentar recriar do zero o que a V009 já criou.
    baseline-on-migrate: true
    baseline-version: "1"

barrier:
  # Preenchido pelo Maven (resource filtering do spring-boot-starter-parent) a partir da
  # versão do POM — o banner lê daqui, então basta bumpar o POM para o banner acompanhar.
  version: @project.version@
  admin:
    # Protege /v1/webhook-endpoints (header X-Admin-Key). Vazia por padrão: em dev o filtro fica
    # inerte; em prod a aplicação não sobe sem ela (AdminApiKeyReadinessGuard).
    api-key: ${ADMIN_API_KEY:}
  webhook:
    consumer:
      # Retry do CONSUMO (não da entrega): falha transitória é retentada sem commitar o offset,
      # até no máximo retry-max-elapsed; depois o evento vai para a DLT e a reconciliação assume.
      retry-initial: PT2S
      retry-max-elapsed: PT2M
    reconciliation:
      # Relê o tópico e cria entrega para toda decisão que não tem uma. A janela precisa caber na
      # retenção do Kafka — é ela que limita o quanto de indisponibilidade dá para recuperar.
      window: PT6H
      cron: "0 */15 * * * *" # a cada 15 minutos
